name: pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app; print('loaded ok, key length:', len(app.API_KEY))"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    needs: [test, secret-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying to staging with ${PAYMENTS_API_KEY:0:3}***"
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}

  deploy-production:
    needs: [test, secret-scan]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to production"
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}

  deploy-k8s:
    needs: [test, secret-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sops
        run: |
          curl -Lo sops https://github.com/getsops/sops/releases/latest/download/sops-linux-amd64
          chmod +x sops && sudo mv sops /usr/local/bin/
      - name: Decrypt secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops --decrypt k8s/secret.enc.yaml > k8s/secret.yaml
      - uses: helm/kind-action@v1
      - run: kubectl apply -f k8s/secret.yaml
      - run: kubectl get secret payments-api -o jsonpath='{.data.PAYMENTS_API_KEY}' | base64 -d
      - run: rm k8s/secret.yaml
