name: pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app; print('loaded ok, key length:', len(app.API_KEY))"

  deploy-staging:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying to staging with ${PAYMENTS_API_KEY:0:3}***"
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}

  deploy-production:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to production"
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
